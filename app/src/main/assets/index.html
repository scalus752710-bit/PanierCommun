<title>Panier Commun</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: barre latérale fixe + espace de travail ; à 820px la navigation passe en bandeau défilant */
:root{
  --bg:#f3f5f1; --surface:#ffffff; --sunk:#e8ece5; --line:#d5dbd1;
  --ink:#1b231e; --muted:#5d6a61;
  --accent:#2c6a4c; --accent-ink:#ffffff; --accent-soft:#dcebe2;
  --mustard:#b57a10; --mustard-soft:#f6e9cc;
  --ok:#2d7a3e; --warn:#b26b00; --bad:#b3261e;
  --ok-soft:#dff0e2; --warn-soft:#fbecd2; --bad-soft:#f8dedb;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121714; --surface:#1a211c; --sunk:#222b25; --line:#323d35;
  --ink:#e7ede8; --muted:#9aa89e;
  --accent:#6fc297; --accent-ink:#0d1d14; --accent-soft:#1f3a2b;
  --mustard:#e0a940; --mustard-soft:#3a2f17;
  --ok:#74c98a; --warn:#e7a54a; --bad:#f08a80;
  --ok-soft:#1d3523; --warn-soft:#3a2c16; --bad-soft:#3d1f1c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121714; --surface:#1a211c; --sunk:#222b25; --line:#323d35;
  --ink:#e7ede8; --muted:#9aa89e;
  --accent:#6fc297; --accent-ink:#0d1d14; --accent-soft:#1f3a2b;
  --mustard:#e0a940; --mustard-soft:#3a2f17;
  --ok:#74c98a; --warn:#e7a54a; --bad:#f08a80;
  --ok-soft:#1d3523; --warn-soft:#3a2c16; --bad-soft:#3d1f1c; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
h1,h2,h3{font-family:var(--f-display);font-weight:700;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:1.75rem} h2{font-size:1.2rem} h3{font-size:1rem}
.num{font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
.side{background:var(--surface);border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px}
.brand svg{flex:none}
.logo-slot{position:relative;flex:none;width:44px;height:44px;border:1px dashed transparent;border-radius:10px;background:none;padding:0;display:grid;place-items:center}
.logo-slot:hover,.logo-slot:focus-visible{border-color:var(--accent)}
.logos2{display:flex;flex-direction:column;gap:6px;margin-top:6px}.logos2 .logo2{margin-top:0}
.logo2{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;min-height:72px;margin-top:6px;padding:8px;border:1px dashed transparent;border-radius:10px;background:none;color:var(--muted);font:inherit;font-size:.85rem;cursor:pointer}
.logo2 img{max-width:100%;max-height:110px;object-fit:contain;border-radius:6px}
.logo2.empty{border-color:var(--line)}.logo2:hover,.logo2:focus-visible{border-color:var(--accent);color:var(--accent)}
.logo-slot img{width:44px;height:44px;object-fit:contain;border-radius:8px;background:var(--surface)}
.logo-edit{position:absolute;right:-4px;bottom:-4px;width:18px;height:18px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-size:.7rem;display:grid;place-items:center;opacity:0;transition:opacity .15s}
.logo-slot:hover .logo-edit,.logo-slot:focus-visible .logo-edit{opacity:1}
.logo-drop{border:2px dashed var(--line);border-radius:12px;padding:22px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px}
.logo-drop img{max-width:160px;max-height:120px;object-fit:contain}
.brand b{font-family:var(--f-display);font-size:1.15rem;line-height:1.1}
.brand small{display:block;color:var(--muted);font-size:.75rem}
nav{display:flex;flex-direction:column;gap:2px}
nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;color:var(--ink);text-decoration:none;font-weight:700;font-size:.92rem}
nav a:hover{background:var(--sunk)}
nav a[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
nav a .dot{width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.35}
nav a[aria-current="page"] .dot{opacity:1}
.sync-dot{width:9px;height:9px;border-radius:50%;background:var(--muted);display:inline-block}.sync-dot[data-s="ok"]{background:var(--accent)}.sync-dot[data-s="wait"]{background:#c58a12}.sync-dot[data-s="err"]{background:#b3261e}
#lock{position:fixed;inset:0;z-index:100;background:var(--bg);display:grid;place-items:center;padding:16px;overflow:auto}
.lock-card{width:min(340px,100%);text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px}
.lock-card h1{font-family:var(--f-display);font-size:1.5rem;margin:6px 0 0}.lock-card p{margin:0}
.lock-logo img,.lock-logo svg{width:56px;height:56px;border-radius:14px;object-fit:contain}
.pin-dots{display:flex;gap:14px;margin:18px 0 4px}.pin-dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--accent);transition:background .1s}.pin-dots i.on{background:var(--accent)}
.pin-dots.shake{animation:pinshake .35s}@keyframes pinshake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.pin-err{min-height:1.3em;color:var(--bad);font-size:.9rem}
.pin-pad{display:grid;grid-template-columns:repeat(3,72px);gap:12px;margin-top:6px}
.pin-pad button{height:72px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:1.5rem;font-weight:700;font-family:var(--f-body)}
.pin-pad button:active{background:var(--accent-soft)}
.fact-filters{display:flex;flex-wrap:wrap;gap:12px}.fact-filters label{display:flex;flex-direction:column;gap:4px;font-size:.82rem;font-weight:700;color:var(--muted);flex:1 1 150px}
.fact-filters select,.fact-filters input{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit;font-weight:400}
.day-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;margin-bottom:10px}.day-head p{margin:2px 0 0;font-size:.85rem}
.receipt-tk{max-width:360px;margin:0 auto;font-size:.92rem}.tk-h{text-align:center;margin:0 0 10px}
.tk-meta,.tk-tot{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:0;padding:10px 0;border-top:1px dashed var(--line)}.tk-meta dt,.tk-tot dt{color:var(--muted)}.tk-meta dd,.tk-tot dd{margin:0;text-align:right}
.tk-lines{width:100%;border-collapse:collapse;border-top:1px dashed var(--line)}.tk-lines td{padding:6px 0;vertical-align:top;border:0}.tk-lines .r{text-align:right}
.rscan{display:flex;flex-direction:column;gap:6px;padding:12px;border:1px dashed var(--accent);border-radius:8px;background:var(--accent-soft)}.rscan .scanbar{margin:0}.rscan .scanvid{margin-top:4px}
.themebtn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:7px 10px;font-weight:700;font-size:.85rem;white-space:nowrap;flex-shrink:0;cursor:pointer}
body.logos-locked .logo2.empty{display:none!important}body.logos-locked .logo2,body.logos-locked .logo-slot{cursor:default;border-color:transparent!important}body.logos-locked .logo-edit{display:none}
.lockbtn::before{content:"🔒 "}.lockbtn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:7px 10px;font-weight:700;font-size:.85rem;white-space:nowrap;flex-shrink:0}
.acc-tbl th.c,.acc-tbl td.c{text-align:center}.acc-tbl input{width:18px;height:18px}
.side .who{margin-top:auto;font-size:.82rem;color:var(--muted);padding:10px;border-top:1px solid var(--line)}
.side .who select{width:100%;margin-top:4px;padding:6px;border:1px solid var(--line);border-radius:6px;background:var(--bg)}

main{padding-block:28px 60px;padding-left:max(28px, env(safe-area-inset-left,0px));padding-right:max(28px, env(safe-area-inset-right,0px));min-width:0}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.head p{margin:4px 0 0;color:var(--muted)}
.eyebrow{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}

.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;font-weight:700;font-size:.9rem}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.small{padding:4px 10px;font-size:.82rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.danger{color:var(--bad);border-color:var(--bad-soft)}
.btn.danger:hover{border-color:var(--bad)}
.btn.danger.armed{background:var(--bad);color:var(--surface);border-color:var(--bad)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g32{grid-template-columns:minmax(0,3fr) minmax(0,2fr)}
.kpi .v{font-family:var(--f-display);font-size:1.9rem;font-weight:700;line-height:1.1;margin-top:6px}
.kpi .s{color:var(--muted);font-size:.85rem}

.tbl-wrap{overflow-x:auto;margin:0 -18px;padding:0 18px}
table{width:100%;border-collapse:collapse;font-size:.92rem}
th{text-align:left;font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer} tbody tr.click:hover{background:var(--sunk)}
td.r,th.r{text-align:right}

.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:999px;font-size:.78rem;font-weight:700;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.neutral{background:var(--sunk);color:var(--muted)}
.pill.acc{background:var(--accent-soft);color:var(--accent)}
.light{width:10px;height:10px;border-radius:50%;display:inline-block}
.light.ok{background:var(--ok)} .light.warn{background:var(--warn)} .light.bad{background:var(--bad)}

.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.toolbar input[type=search]{flex:1;min-width:180px}
input[type=text],input[type=number],input[type=date],input[type=search],select,textarea{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);width:100%}
label{display:flex;flex-direction:column;gap:4px;font-size:.82rem;font-weight:700;color:var(--muted)}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.form .full{grid-column:1/-1}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:6px 12px;font-size:.85rem;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}

/* Caisse */
.pos{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:16px;align-items:start}
.prods{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.prod{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:6px;min-height:118px}
.prod:hover{border-color:var(--accent)}
.prod .n{font-weight:700;line-height:1.25}
.prod .c{font-size:.75rem;color:var(--muted)}
.prod .p{margin-top:auto;display:flex;align-items:baseline;gap:6px}
.prod .p b{font-family:var(--f-display);font-size:1.15rem;color:var(--accent)}
.prod .p s{color:var(--muted);font-size:.82rem}
.prod[disabled]{opacity:.4}
.ticket{position:sticky;top:16px}
.ticket .line{display:grid;grid-template-columns:1fr auto auto auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line);font-size:.92rem}
.qty{display:inline-flex;align-items:center;gap:4px}
.rm{border:0;background:none;color:var(--bad);font-weight:700;font-size:1.2rem;line-height:1;width:26px;height:26px;border-radius:6px}
.rm:hover{background:var(--bad-soft)}
.qty button{width:26px;height:26px;border-radius:6px;border:1px solid var(--line);background:var(--bg);font-weight:700;line-height:1}
.tot{display:flex;justify-content:space-between;align-items:baseline;padding-top:10px}
.tot.big b{font-family:var(--f-display);font-size:1.7rem}
.saving{background:var(--mustard-soft);color:var(--mustard);border-radius:8px;padding:8px 10px;font-weight:700;font-size:.88rem;margin-top:10px}
.gauge{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden;margin-top:6px}
.gauge i{display:block;height:100%;background:var(--accent)}
.gauge.over i{background:var(--bad)}
.alert{border-radius:8px;padding:8px 10px;font-size:.88rem;font-weight:700;margin-top:10px}
.alert.bad{background:var(--bad-soft);color:var(--bad)}
.alert.warn{background:var(--warn-soft);color:var(--warn)}
.scanbar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.scanbar input{flex:1;min-width:200px}
.scanvid{position:relative;border-radius:10px;overflow:hidden;background:#000;aspect-ratio:4/3;max-height:60vh;margin:0 auto}
.scanvid video{width:100%;height:100%;object-fit:cover;display:block}
.scanvid .aim{position:absolute;left:8%;right:8%;top:36%;height:28%;border:2px solid #fff;border-radius:8px;box-shadow:0 0 0 999px rgba(0,0,0,.35);pointer-events:none}
.scanvid.flash .aim{border-color:#6fc297;box-shadow:0 0 0 999px rgba(30,90,60,.45)}
.scanlast{margin-top:10px;padding:10px 12px;border-radius:8px;background:var(--sunk);font-size:.9rem;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}

/* Commission : colonnes d'étapes */
.board{display:grid;grid-template-columns:repeat(4,minmax(220px,1fr));gap:12px;overflow-x:auto;padding-bottom:6px}
.col{background:var(--sunk);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;gap:8px;min-width:0}
.col h3{font-size:.85rem;display:flex;justify-content:space-between;padding:2px 4px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px;font-size:.88rem;display:flex;flex-direction:column;gap:6px}
.card.urgent{border-left:3px solid var(--bad)}
.card .acts{display:flex;gap:6px;flex-wrap:wrap}

/* Graphiques */
.chart text{fill:var(--muted);font-size:11px;font-family:var(--f-body)}
.chart .grid line{stroke:var(--line)}
.chart .bar{fill:var(--accent)}
.chart .bar2{fill:var(--mustard)}
.chart .endlbl{fill:var(--ink);font-weight:700}
.legend{display:flex;gap:14px;font-size:.8rem;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.hbar{display:grid;grid-template-columns:140px 1fr 70px;gap:10px;align-items:center;font-size:.88rem;padding:4px 0}
.hbar .track{height:10px;background:var(--sunk);border-radius:99px;overflow:hidden}
.hbar .track i{display:block;height:100%;background:var(--accent);border-radius:99px}

/* Planning */
.week{display:grid;grid-template-columns:120px repeat(5,minmax(110px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;min-width:700px}
.week > div{background:var(--surface);padding:8px;font-size:.84rem;min-height:56px}
.week .hd{background:var(--sunk);font-weight:700;min-height:0;font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.slot{display:block;background:var(--accent-soft);color:var(--accent);border-radius:6px;padding:3px 7px;margin-bottom:4px;font-weight:700;font-size:.78rem}
.slot.m{background:var(--mustard-soft);color:var(--mustard)}
button.slot{border:0;width:100%;text-align:left;cursor:pointer}
button.slot:hover{outline:1px solid currentColor}
.ysel{width:auto;padding:4px 8px;font-weight:700;font-size:.9rem}
.slot-add{display:block;width:100%;border:1px dashed var(--line);background:none;color:var(--muted);border-radius:6px;padding:2px 6px;font-size:.75rem;opacity:.6}
.slot-add:hover,.slot-add:focus-visible{opacity:1;border-color:var(--accent);color:var(--accent)}

/* Modale */
.overlay{position:fixed;inset:0;background:rgba(10,15,12,.5);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto;z-index:50}
.modal{background:var(--surface);border-radius:14px;width:100%;max-width:680px;padding:22px;border:1px solid var(--line);display:flex;flex-direction:column;gap:16px}
.modal .mh{display:flex;justify-content:space-between;align-items:center;gap:10px}
.modal .mf{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.x{border:0;background:none;font-size:1.4rem;line-height:1;color:var(--muted)}
.rav{display:flex;align-items:center;gap:14px;padding:14px;border-radius:var(--r);background:var(--sunk)}
.rav b{font-family:var(--f-display);font-size:1.6rem}
.receipt{border:1px solid var(--line);border-radius:8px;padding:18px;background:var(--bg);font-size:.9rem;display:flex;flex-direction:column;gap:8px}
.receipt .rt{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line);padding-bottom:8px}
.muted{color:var(--muted)}
.eanbtn{border:0;background:none;padding:0;cursor:pointer;display:block;border-radius:4px}
.eanbtn:hover svg{outline:2px solid var(--accent);outline-offset:2px}
svg.ean{display:block;height:auto;border-radius:3px}
.labels{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.label{background:#fff;color:#111;border:1px solid #d6d6d6;border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.label .ln{font-weight:700;font-size:.9rem;line-height:1.2}
.label .lm{font-size:.72rem;color:#555}
.label .lp{font-family:var(--f-display);font-weight:700;font-size:1.1rem}
.label .lp span{font-family:var(--f-body);font-weight:400;font-size:.72rem;color:#555;margin-left:6px}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:10px;font-weight:700;z-index:60;font-size:.9rem}
.sample{font-size:.78rem;color:var(--mustard);background:var(--mustard-soft);padding:3px 9px;border-radius:999px;font-weight:700}
.dl{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:.9rem}
.dl dt{color:var(--muted)} .dl dd{margin:0;font-weight:700}

@media (max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.pos{grid-template-columns:1fr}.ticket{position:static}}
@media (max-width:820px){
  .app{grid-template-columns:minmax(0,1fr)}.side{min-width:0;max-width:100vw}
  .side{position:sticky;top:env(safe-area-inset-top,0px);height:auto;flex-direction:row;align-items:center;padding:10px max(16px, env(safe-area-inset-right,0px)) 10px max(16px, env(safe-area-inset-left,0px));z-index:20;border-right:0;border-bottom:1px solid var(--line);overflow:visible;flex-wrap:wrap;gap:8px 10px}

/* ---------- Graphique en barres ---------- */
function barChart(labels, a, b, opts={}){
  const W=640,H=230,pl=44,pr=10,pt=16,pb=28; const iw=W-pl-pr, ih=H-pt-pb;
  const max=Math.max(...a,...(b||[0]))||1; const step=niceStep(max/4); const top=Math.ceil(max/step)*step;
  const y=v=>pt+ih-(v/top)*ih; const gw=iw/labels.length; const bw=b?gw*0.3:gw*0.5;
  let g=""; for(let v=0;v<=top+1e-9;v+=step){ g+=`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}"/><text x="${pl-6}" y="${y(v)+4}" text-anchor="end">${opts.money?Math.round(v)+" €":Math.round(v)}</text>`; }
  let bars="";
  labels.forEach((l,i)=>{
    const x0=pl+gw*i+gw/2;
    if(b){ bars+=`<rect class="bar" x="${x0-bw-2}" y="${y(a[i])}" width="${bw}" height="${pt+ih-y(a[i])}" rx="3"/><rect class="bar2" x="${x0+2}" y="${y(b[i])}" width="${bw}" height="${pt+ih-y(b[i])}" rx="3"/>`; }
    else { bars+=`<rect class="bar" x="${x0-bw/2}" y="${y(a[i])}" width="${bw}" height="${pt+ih-y(a[i])}" rx="3"/>`; }
    if(i===labels.length-1 && !b) bars+=`<text class="endlbl" x="${x0}" y="${y(a[i])-5}" text-anchor="middle">${a[i]}</text>`;
    bars+=`<text x="${x0}" y="${H-8}" text-anchor="middle">${l}</text>`;
  });
  return `<div style="overflow-x:auto"><svg class="chart" viewBox="0 0 ${W} ${H}" width="100%" style="min-width:420px" role="img" aria-label="${esc(opts.label||"Graphique")}"><g class="grid">${g}</g>${bars}</svg></div>`;
}
function niceStep(x){ const p=Math.pow(10,Math.floor(Math.log10(x||1))); const n=x/p; return (n<=1?1:n<=2?2:n<=5?5:10)*p; }
const Y=()=>S.annee||TODAY.getFullYear();
function yearSel(id){ const ys=S.ventes.map(v=>+v.date.slice(0,4)); const lo=Math.min(TODAY.getFullYear()-1,...ys), hi=TODAY.getFullYear()+1; const opts=[]; for(let y=hi;y>=lo;y--) opts.push(y);
  return `<select id="${id}" class="ysel" aria-label="Année">${opts.map(y=>`<option ${y===Y()?"selected":""}>${y}</option>`).join("")}</select>`; }
function bindYear(id,cb){ const e=document.getElementById(id); if(e) e.onchange=()=>{ S.annee=+e.value===TODAY.getFullYear()?null:+e.value; save(); cb(); }; }
function last6(n=6){ const out=[]; for(let m=n-1;m>=0;m--){ const d=new Date(TODAY.getFullYear(),TODAY.getMonth()-m,1); out.push({k:iso(d).slice(0,7),l:MONTHS[d.getMonth()]}); } return out; }

  <div class="head"><div><h1>Inscriptions</h1><p>Chaque dossier avance jusqu'à la commission, qui décide : validé, refusé ou reporté.</p></div><button class="btn primary" id="addD">Nouveau dossier</button></div>
  <div class="board">${cols.map(c=>{const ds=S.dossiers.filter(d=>d.etape===c);return `<div class="col"><h3><span>${c}</span><span class="muted num">${ds.length}</span></h3>
    ${ds.map(d=>`<div class="card ${d.prio==="urgente"?"urgent":""}">
      <div style="display:flex;justify-content:space-between;gap:6px"><b>${esc(d.nom)}</b>${d.prio==="urgente"?`<span class="pill bad">Urgent</span>`:""}</div>
      <div class="muted">${esc(d.compo)}</div>
      <div hidden>${d.rav!=null?`<span class="light ${ravLevel(d.rav)}"></span> <span class="num">${eur(d.rav)}/j</span>`:`<span class="muted">Reste à vivre à calculer</span>`}</div>
      <div class="muted" style="font-size:.8rem">Pièces : ${esc(d.pieces)}</div>
      ${d.decision?`<div><span class="pill ${d.decision==="Validé"?"ok":d.decision==="Refusé"?"bad":"warn"}">${d.decision}</span><div class="muted" style="font-size:.8rem;margin-top:4px">${esc(d.motif)}</div></div>`:""}
      <div class="acts">${c==="Commission"?`<button class="btn small primary" data-dec="${d.id}">Décider</button>`:c!=="Décidé"?`<button class="btn small" data-next="${d.id}">Étape suivante</button>`:""}<button class="btn small danger" data-deld="${d.id}" style="margin-left:auto" aria-label="Supprimer le dossier ${esc(d.nom)}">Supprimer</button></div>
    </div>`).join("")||`<p class="muted" style="font-size:.85rem;padding:4px">Aucun dossier.</p>`}</div>`;}).join("")}</div>
  `;
  V().querySelectorAll("[data-next]").forEach(b=>b.onclick=()=>{const d=S.dossiers.find(x=>x.id===b.dataset.next);d.etape=cols[cols.indexOf(d.etape)+1];if(d.etape==="Commission")d.pieces="Complet";save();R.inscriptions();});
  V().querySelectorAll("[data-dec]").forEach(b=>b.onclick=()=>decideModal(b.dataset.dec));
  V().querySelectorAll("[data-deld]").forEach(b=>b.onclick=()=>{
    if(!b.classList.contains("armed")){ b.classList.add("armed"); b.textContent="Confirmer"; b.title="Cliquez encore pour supprimer définitivement"; return; }
    const d=S.dossiers.find(x=>x.id===b.dataset.deld); S.dossiers=S.dossiers.filter(x=>x!==d);
    save(); R.inscriptions(); toast(`Dossier ${d.nom} supprimé`);
  });
  $("#addD").onclick=()=>{
    modal("Nouveau dossier",`<div class="form">
      <label class="full">Nom du bénéficiaire<input type="text" id="dn" placeholder="Famille ou personne"></label>
      <label>Composition<input type="text" id="dc" placeholder="1 adulte, 2 enfants"></label>
      <label>Priorité<select id="dp"><option value="normale">Normale</option><option value="urgente">Urgente</option></select></label>
      <label>Revenus mensuels (€)<input type="number" id="dr" min="0"></label>
      <label>Charges mensuelles (€)<input type="number" id="dch" min="0"></label>
      <label>Nombre de personnes<input type="number" id="dnp" min="1" value="1"></label></div>`,
      `<button class="btn" data-close>Annuler</button><button class="btn primary" id="saveD">Créer le dossier</button>`);
    $("#saveD").onclick=()=>{ const n=$("#dn").value.trim(); if(!n){toast("Indiquez le nom du bénéficiaire.");return;}
      const r=$("#dr").value?(+$("#dr").value-(+$("#dch").value||0))/Math.max(1,+$("#dnp").value)/30:null;
      S.dossiers.push({id:uid(),nom:n,compo:$("#dc").value||"—",prio:$("#dp").value,etape:"Brouillon",rav:r,pieces:"À compléter",decision:"",motif:"",np:+$("#dnp").value||1,rev:+$("#dr").value||0,ch:+$("#dch").value||0});
      save();closeModal();R.inscriptions();toast("Dossier créé"); };

};
function decideModal(id){
  const d=S.dossiers.find(x=>x.id===id);
  modal(`Décision : ${d.nom}`,`<dl class="dl"><dt>Composition</dt><dd>${esc(d.compo)}</dd><dt hidden></dt><dd hidden>${d.rav!=null?eur(d.rav)+"/j · "+ravLabel(d.rav):"—"}</dd><dt>Priorité</dt><dd>${d.prio}</dd></dl>
    <div class="form" style="margin-top:14px"><label>Décision<select id="dd"><option>Validé</option><option>Refusé</option><option>Reporté</option></select></label>
    <label>Accès épicerie accordé pour<select id="dm"><option value="90">3 mois</option><option value="180">6 mois</option></select></label>
    <label class="full">Motif<textarea id="dmo" rows="3" placeholder="Motif inscrit au compte rendu de la séance"></textarea></label></div>`,
    `<button class="btn" data-close>Annuler</button><button class="btn primary" id="okD">Enregistrer la décision</button>`);
  $("#okD").onclick=()=>{ const dec=$("#dd").value, mo=$("#dmo").value.trim();
    if(dec!=="Validé"&&!mo){toast("Un motif est obligatoire pour un refus ou un report.");$("#dmo").focus();return;}
    d.decision=dec; d.motif=mo||"Conforme au barème"; d.etape="Décidé";
    if(dec==="Validé"){ const parts=d.nom.replace(/^(M\.|Mme|Famille)\s+/,"").split(" ");
      S.foyers.push({id:uid(),prenom:parts.length>1?parts[0]:"",nom:parts.slice(parts.length>1?1:0).join(" "),adultes:1,enfants:[],situation:"Seul",csp:"",revenus:d.rev||0,charges:d.ch||0,epi:{on:true,fin:addDays(+$("#dm").value),plafond:40},bou:{on:false,fin:"",plafond:0}}); }
    save();closeModal();R.inscriptions();toast(dec==="Validé"?"Dossier validé, fiche bénéficiaire créée":"Décision enregistrée"); };
}

/* Caisse */
let cart=[], cFoyer="", cMode="epi", cCat="Tous", cPay="especes";
R.caisse=function(){
  const elig=S.foyers.filter(f=>accesActif(f[cMode]));
  if(cFoyer && !elig.some(f=>f.id===cFoyer)) cFoyer="";
  const f=S.foyers.find(x=>x.id===cFoyer);
  const cats=["Tous",...new Set(S.produits.map(p=>p.cat))];
  const prods=S.produits.filter(p=>stockQ(p)>0&&(cCat==="Tous"||p.cat===cCat));
  const tot=cart.reduce((a,l)=>a+l.q*l.sol,0), val=cart.reduce((a,l)=>a+l.q*l.off,0);
  const deja=f?payeMois(f.id):0, plaf=f?f[cMode].plafond:0, reste=plaf-deja;
  const over=f && plaf && tot>reste+1e-9;
  V().innerHTML=`
  <div class="head"><div><h1>Caisse</h1><p>Identifiez le bénéficiaire, scannez ou ajoutez les produits : le prix solidaire et le plafond s'appliquent seuls.</p></div>
    <div class="seg" role="group" aria-label="Espace">${[["epi","Épicerie"],["bou","Boutique"]].map(([k,l])=>`<button data-mode="${k}" aria-pressed="${cMode===k}">${l}</button>`).join("")}</div></div>
  <div class="pos">
    <div>
      <div class="scanbar"><input type="text" id="scan" inputmode="numeric" autocomplete="off" aria-label="Code-barres" placeholder="${f?"Scannez ou tapez un code-barres, puis Entrée":"Choisissez d'abord un bénéficiaire pour scanner"}" ${f?"":"disabled"}><button class="btn primary" id="cam" ${f?"":"disabled"}>Scanner avec la caméra</button></div>
      <div class="toolbar"><div class="seg" role="group" aria-label="Catégorie" style="flex-wrap:wrap">${cats.map(c=>`<button data-cat="${esc(c)}" aria-pressed="${c===cCat}">${esc(c)}</button>`).join("")}</div></div>
      <div class="prods">${prods.map(p=>{const q=stockQ(p)-(cart.find(l=>l.pid===p.id)?.q||0);return `<button class="prod" data-p="${p.id}" ${q<=0||!f?"disabled":""}>
        <span class="c">${esc(p.cat)} · ${q} en stock</span><span class="n">${esc(p.nom)}</span>
        <span class="p"><b class="num">${eur(p.sol)}</b><s class="num">${eur(p.off)}</s></span></button>`;}).join("")}</div>
    </div>
    <div class="panel ticket">
      <label>Bénéficiaire<select id="cf"><option value="">— Choisir un bénéficiaire —</option>${elig.map(x=>`<option value="${x.id}" ${x.id===cFoyer?"selected":""}>${esc(x.prenom+" "+x.nom)}</option>`).join("")}</select></label>
      ${f&&!plaf?`<div style="margin-top:10px;font-size:.85rem" class="muted">Sans plafond mensuel · ${eur(deja)} payés ce mois</div>`:f?`<div style="margin-top:10px;font-size:.85rem"><div style="display:flex;justify-content:space-between"><span class="muted">Plafond du mois</span><span class="num">${eur(deja+tot)} / ${eur(plaf)}</span></div><div class="gauge ${over?"over":""}"><i style="width:${Math.min(100,plaf?(deja+tot)/plaf*100:0)}%"></i></div></div>`:`<p class="muted" style="font-size:.85rem">${elig.length?"Sélectionnez un bénéficiaire pour commencer.":"Aucun bénéficiaire n'a d'accès actif à cet espace."}</p>`}
      <div style="margin-top:12px">${cart.map(l=>`<div class="line"><span>${esc(l.nom)}<div class="muted num" style="font-size:.78rem">${eur(l.sol)} au lieu de ${eur(l.off)}</div></span>
        <span class="qty"><button data-dec="${l.pid}" aria-label="Retirer un">−</button><span class="num">${l.q}</span><button data-inc="${l.pid}" aria-label="Ajouter un">+</button></span><b class="num">${eur(l.q*l.sol)}</b><button class="rm" data-rm="${l.pid}" aria-label="Retirer ${esc(l.nom)} du panier" title="Retirer le produit">×</button></div>`).join("")||`<p class="muted" style="font-size:.85rem">Panier vide.</p>`}${cart.length?`<button class="btn small" id="vider" style="margin-top:8px">Vider le panier</button>`:""}</div>
      <div class="tot"><span class="muted">Valeur marchande</span><span class="num">${eur(val)}</span></div>
      <div class="tot big"><span>À régler</span><b class="num">${eur(tot)}</b></div>
      ${cart.length?`<div class="saving">Économie solidaire pour le bénéficiaire : ${eur(val-tot)}</div>`:""}
      ${over?`<div class="alert bad">Plafond dépassé de ${eur(tot-reste)}. Retirez des articles avant d'encaisser.</div>`:""}
      <div style="margin-top:12px;display:flex;flex-direction:column;gap:8px">
        <div class="seg" role="group" aria-label="Paiement" style="width:100%">${[["especes","Espèces"],["carte","Carte"],["mixte","Mixte"]].map(([k,l])=>`<button style="flex:1" data-pay="${k}" aria-pressed="${cPay===k}">${l}</button>`).join("")}</div>
        <button class="btn primary" id="enc" ${!f||!cart.length||over?"disabled":""}>Encaisser ${cart.length?eur(tot):""}</button>
      </div>
    </div>
  </div>`;
  V().querySelectorAll("[data-mode]").forEach(b=>b.onclick=()=>{cMode=b.dataset.mode;cart=[];R.caisse();});
  V().querySelectorAll("[data-cat]").forEach(b=>b.onclick=()=>{cCat=b.dataset.cat;R.caisse();});
  V().querySelectorAll("[data-pay]").forEach(b=>b.onclick=()=>{cPay=b.dataset.pay;R.caisse();});
  $("#cf").onchange=e=>{cFoyer=e.target.value;cart=[];R.caisse(); const s=$("#scan"); if(s&&!s.disabled&&matchMedia("(pointer:fine)").matches) s.focus();};
  const add=(pid,d)=>{const p=S.produits.find(x=>x.id===pid);let l=cart.find(x=>x.pid===pid);
    if(!l){if(d<0)return;l={pid,nom:p.nom,cat:p.cat,q:0,off:p.off,sol:p.sol};cart.push(l);}
    l.q+=d; if(l.q>stockQ(p))l.q=stockQ(p); if(l.q<=0)cart=cart.filter(x=>x!==l); R.caisse();};
  V().querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>add(b.dataset.p,1));
  V().querySelectorAll("[data-inc]").forEach(b=>b.onclick=()=>add(b.dataset.inc,1));
  V().querySelectorAll("[data-dec]").forEach(b=>b.onclick=()=>add(b.dataset.dec,-1));
  V().querySelectorAll("[data-rm]").forEach(b=>b.onclick=()=>{const l=cart.find(x=>x.pid===b.dataset.rm);cart=cart.filter(x=>x!==l);R.caisse();toast(`${l.nom} retiré du panier`);});
  const vd=$("#vider"); if(vd) vd.onclick=()=>{cart=[];R.caisse();toast("Panier vidé");};
  const sc=$("#scan"); if(sc) sc.onkeydown=e=>{ if(e.key!=="Enter") return; e.preventDefault(); const v=sc.value; sc.value=""; scanAdd(v); const n=$("#scan"); if(n) n.focus(); };
  const cb=$("#cam"); if(cb) cb.onclick=camModal;
  const enc=$("#enc"); if(enc) enc.onclick=()=>{
    cart.forEach(l=>{const p=S.produits.find(x=>x.id===l.pid);let q=l.q;
      p.lots.sort((a,b)=>(a.dlc||"9999").localeCompare(b.dlc||"9999")).forEach(lot=>{const t=Math.min(lot.q,q);lot.q-=t;q-=t;});
      p.lots=p.lots.filter(x=>x.q>0);});
    S.ventes.push({id:uid(),date:iso(TODAY),foyer:cFoyer,lignes:cart.map(l=>({...l})),paye:tot,valeur:val,caisse:whoName(),paiement:cPay,heure:new Date().toTimeString().slice(0,5)});
    save(); const n=nomF(cFoyer); cart=[]; R.caisse(); toast(`Vente encaissée pour ${n} : ${eur(tot)}`);
  };
};

/* ---------- Facturation : tickets de caisse classés par jour ---------- */
const PAY={especes:"Espèces",carte:"Carte",mixte:"Mixte"};
const payL=v=>PAY[v.paiement]||"—";
const ticketNo=v=>{ const same=S.ventes.filter(x=>x.date===v.date); return "T"+v.date.replace(/-/g,"")+"-"+String(same.indexOf(v)+1).padStart(3,"0"); };
const nbArt=v=>v.lignes.reduce((a,l)=>a+l.q,0);
const jourL=d=>cap(new Date(d+"T00:00").toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long",year:"numeric"}));
const moisL=k=>cap(new Date(k+"-01T00:00").toLocaleDateString("fr-FR",{month:"long",year:"numeric"}));
const ASSO=()=>{ const b=$(".brand small"); return b?b.textContent.trim():""; };
let fMois=null, fPay="tous", fQ="";
R.facturation=function(){
  const mois=[...new Set([thisMonth,...S.ventes.map(v=>monthKey(v.date))])].sort().reverse();
  if(!fMois||!mois.includes(fMois)) fMois=mois[0];
  const q=fQ.trim().toLowerCase();
  S.raz=S.raz||{}; const HID=new Set(S.raz.factHide||[]);
  const hidM=S.ventes.filter(v=>monthKey(v.date)===fMois&&HID.has(v.id));
  const list=S.ventes.filter(v=>monthKey(v.date)===fMois&&!HID.has(v.id)&&(fPay==="tous"||(v.paiement||"")===fPay)&&(!q||(ticketNo(v)+" "+nomF(v.foyer)+" "+(v.caisse||"")).toLowerCase().includes(q)));
  const days={}; list.forEach(v=>(days[v.date]=days[v.date]||[]).push(v));
  const keys=Object.keys(days).sort().reverse();
  const sum=(a,f)=>a.reduce((s,v)=>s+f(v),0);
  const RZ=S.raz.fact||{};
  const kl=k=>{ const ex=new Set(RZ[k]||[]); return list.filter(v=>!ex.has(v.id)); };
  const kT=kl("tickets"), kM=kl("total"), kE=kl("especes"), kC=kl("carte");
  const rz=k=>`<button class="btn small" data-frz="${k}" style="margin-top:10px">Remettre à zéro</button>`;
  V().innerHTML=`
  <div class="head"><div><h1>Facturation</h1><p>Tous les tickets de caisse, classés par jour.</p></div><div style="display:flex;gap:8px;flex-wrap:wrap">${hidM.length?`<button class="btn small" id="fRest">Rétablir les journées effacées (${new Set(hidM.map(v=>v.date)).size})</button>`:""}${keys.length?`<button class="btn small danger" id="fDelAll">Effacer toutes les journées du mois</button>`:""}</div></div>
  <div class="panel fact-filters" style="margin-bottom:16px">
    <label>Mois<select id="fM">${mois.map(k=>`<option value="${k}" ${k===fMois?"selected":""}>${moisL(k)}</option>`).join("")}</select></label>
    <label>Paiement<select id="fP">${[["tous","Tous"],...Object.entries(PAY)].map(([k,l])=>`<option value="${k}" ${k===fPay?"selected":""}>${l}</option>`).join("")}</select></label>
    <label style="flex:2 1 200px">Rechercher<input type="search" id="fQ" value="${esc(fQ)}" placeholder="N° de ticket, bénéficiaire ou caissier"></label>
  </div>
  <div class="grid g4" style="margin-bottom:16px">
    <div class="panel kpi"><div class="eyebrow">Tickets</div><div class="v num">${kT.length}</div><div class="s">${new Set(kT.map(v=>v.date)).size} jour${new Set(kT.map(v=>v.date)).size>1?"s":""} d'ouverture</div>${rz("tickets")}</div>
    <div class="panel kpi"><div class="eyebrow">Total encaissé</div><div class="v num">${eur(sum(kM,v=>v.paye))}</div><div class="s">Valeur distribuée : ${eur(sum(kM,v=>v.valeur))}</div>${rz("total")}</div>
    <div class="panel kpi"><div class="eyebrow">Espèces</div><div class="v num">${eur(sum(kE.filter(v=>v.paiement==="especes"),v=>v.paye))}</div><div class="s">Mixte : ${eur(sum(kE.filter(v=>v.paiement==="mixte"),v=>v.paye))}</div>${rz("especes")}</div>
    <div class="panel kpi"><div class="eyebrow">Carte</div><div class="v num">${eur(sum(kC.filter(v=>v.paiement==="carte"),v=>v.paye))}</div><div class="s">Non précisé : ${eur(sum(kC.filter(v=>!PAY[v.paiement]),v=>v.paye))}</div>${rz("carte")}</div>
  </div>
  ${keys.map(d=>{ const vs=days[d].slice().reverse(); return `<div class="panel" style="margin-bottom:16px">
    <div class="day-head"><div><h2>${jourL(d)}</h2><p class="muted">${vs.length} ticket${vs.length>1?"s":""} · ${eur(sum(vs,v=>v.paye))} encaissés</p></div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn small" data-jpdf="${d}">Journal du jour (PDF)</button><button class="btn small danger" data-jdel="${d}">Effacer la journée</button></div></div>
    <div class="tbl-wrap"><table><thead><tr><th>N° de ticket</th><th>Heure</th><th>Bénéficiaire</th><th>Caissier</th><th>Paiement</th><th class="r">Articles</th><th class="r">Montant</th></tr></thead><tbody>
    ${vs.map(v=>`<tr class="click" data-tk="${v.id}" title="Voir le ticket"><td class="num" style="white-space:nowrap"><b>${ticketNo(v)}</b></td><td class="num">${esc(v.heure||"—")}</td><td>${esc(nomF(v.foyer))}</td><td>${esc(v.caisse||"—")}</td><td>${payL(v)}</td><td class="r num">${nbArt(v)}</td><td class="r num"><b>${eur(v.paye)}</b></td></tr>`).join("")}
    </tbody></table></div></div>`; }).join("")||`<div class="panel"><p class="muted" style="margin:0">Aucun ticket pour ce mois${q||fPay!=="tous"?" avec ces filtres":""}.</p></div>`}`;
  $("#fM").onchange=e=>{ fMois=e.target.value; R.facturation(); };
  $("#fP").onchange=e=>{ fPay=e.target.value; R.facturation(); };
  $("#fQ").oninput=e=>{ fQ=e.target.value; const pos=e.target.selectionStart; R.facturation(); const n=$("#fQ"); n.focus(); try{ n.setSelectionRange(pos,pos); }catch(_){} };
  V().querySelectorAll("[data-frz]").forEach(b=>b.onclick=()=>{
    if(!b.classList.contains("armed")){ b.classList.add("danger","armed"); b.textContent="Confirmer"; return; }
    S.raz.fact=S.raz.fact||{}; S.raz.fact[b.dataset.frz]=S.ventes.map(v=>v.id); save(); R.facturation(); toast({tickets:"Compteur de tickets remis à zéro",total:"Total encaissé remis à zéro",especes:"Espèces remises à zéro",carte:"Carte remise à zéro"}[b.dataset.frz]);
  });
  V().querySelectorAll("[data-tk]").forEach(r=>r.onclick=()=>ticketModal(S.ventes.find(v=>v.id===r.dataset.tk)));
  const arm=(b,t)=>{ if(b.classList.contains("armed")) return true; b.classList.add("armed"); b.textContent=t; return false; };
  const hide=ids=>{ S.raz.factHide=[...new Set([...(S.raz.factHide||[]),...ids])]; save(); R.facturation(); };
  V().querySelectorAll("[data-jdel]").forEach(b=>b.onclick=()=>{ if(!arm(b,"Confirmer l'effacement")) return; hide(days[b.dataset.jdel].map(v=>v.id)); toast("Journée du "+fmtD(b.dataset.jdel)+" effacée"); });
  const da=$("#fDelAll"); if(da) da.onclick=()=>{ if(!arm(da,`Confirmer : effacer ${keys.length} journée${keys.length>1?"s":""}`)) return; hide(S.ventes.filter(v=>monthKey(v.date)===fMois).map(v=>v.id)); toast("Journées du mois effacées"); };
  const fr=$("#fRest"); if(fr) fr.onclick=()=>{ const ids=new Set(hidM.map(v=>v.id)); S.raz.factHide=(S.raz.factHide||[]).filter(i=>!ids.has(i)); save(); R.facturation(); toast("Journées rétablies"); };
  V().querySelectorAll("[data-jpdf]").forEach(b=>b.onclick=()=>journalPdf(b.dataset.jpdf,days[b.dataset.jpdf].slice(),b));
};
function ticketModal(v){
  if(!v) return;
  const m=modal("Ticket "+ticketNo(v),`<div class="receipt-tk">
    <p class="tk-h"><b>Panier Commun</b>${ASSO()?`<br>${esc(ASSO())}`:""}</p>
    <dl class="tk-meta"><dt>Ticket</dt><dd class="num">${ticketNo(v)}</dd><dt>Date</dt><dd>${fmtD(v.date)}${v.heure?" à "+esc(v.heure):""}</dd><dt>Bénéficiaire</dt><dd>${esc(nomF(v.foyer))}</dd><dt>Servi par</dt><dd>${esc(v.caisse||"—")}</dd><dt>Paiement</dt><dd>${payL(v)}</dd></dl>
    <table class="tk-lines"><tbody>${v.lignes.map(l=>`<tr><td>${esc(l.nom)}<br><span class="muted num">${l.q} × ${eur(l.sol)}</span></td><td class="r num">${eur(l.q*l.sol)}</td></tr>`).join("")}</tbody></table>
    <dl class="tk-tot"><dt>Total payé</dt><dd class="num"><b>${eur(v.paye)}</b></dd><dt>Valeur en magasin</dt><dd class="num">${eur(v.valeur)}</dd><dt>Économie du bénéficiaire</dt><dd class="num">${eur(v.valeur-v.paye)}</dd></dl>

/* Scan des codes-barres en caisse */
const normEan=c=>String(c||"").replace(/\D/g,"").replace(/^0+/,"");
let AC=null;
function beep(ok){
  try{ AC=AC||new (window.AudioContext||window.webkitAudioContext)(); const o=AC.createOscillator(), g=AC.createGain();
    o.frequency.value=ok?1500:320; g.gain.value=.08; o.connect(g); g.connect(AC.destination); o.start(); o.stop(AC.currentTime+(ok?.09:.28)); }catch(e){}
  try{ navigator.vibrate&&navigator.vibrate(ok?40:[70,40,70]); }catch(e){}
}
function scanAdd(raw){
  const code=String(raw||"").trim(); if(!code) return null;
  if(!S.foyers.some(x=>x.id===cFoyer)){ beep(false); toast("Choisissez d'abord un bénéficiaire."); return null; }
  const n=normEan(code);
  const p=(n&&S.produits.find(x=>x.ean&&normEan(x.ean)===n))||S.produits.find(x=>x.ref&&String(x.ref).toLowerCase()===code.toLowerCase());
  if(!p){ beep(false); toast(`Code ${code} inconnu dans le stock`); return null; }
  let l=cart.find(x=>x.pid===p.id); const st=stockQ(p);
  if((l?l.q:0)>=st){ beep(false); toast(st?`Plus de « ${p.nom} » en stock`:`« ${p.nom} » est en rupture`); return null; }
  if(!l){ l={pid:p.id,nom:p.nom,cat:p.cat,q:0,off:p.off,sol:p.sol}; cart.push(l); }
  l.q++; beep(true); R.caisse(); toast(`${p.nom} ajouté${l.q>1?` (×${l.q})`:""}`); return p;
}
// Douchette branchée en USB ou Bluetooth : capte la saisie rapide même hors du champ
let kbBuf="", kbAt=0;
document.addEventListener("keydown",e=>{
  if((location.hash||"#tableau")!=="#caisse"||$("#modal-root .overlay")) return;
  const t=e.target; if(t&&/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName)) return;
  const now=Date.now(); if(now-kbAt>80) kbBuf=""; kbAt=now;
  if(/^\d$/.test(e.key)) kbBuf+=e.key;
  else if(e.key==="Enter"&&kbBuf.length>=8){ e.preventDefault(); const c=kbBuf; kbBuf=""; scanAdd(c); }
});
let scanStream=null, scanTimer=0, zxReader=null, scanOn=false;
function stopScan(){
  scanOn=false; clearTimeout(scanTimer);
  if(scanStream){ scanStream.getTracks().forEach(t=>t.stop()); scanStream=null; }
  if(zxReader){ try{ zxReader.reset(); }catch(e){} zxReader=null; }
}
const loadZX=()=>window.ZXing?Promise.resolve():new Promise((res,rej)=>{ const s=document.createElement("script");
  s.src="https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js"; s.onload=res; s.onerror=rej; document.head.appendChild(s); });
async function camModal(){
  if(!S.foyers.some(x=>x.id===cFoyer)){ toast("Choisissez d'abord un bénéficiaire."); return; }
  modal("Scanner les produits",`<div class="scanvid" id="svbox"><video id="sv" playsinline muted autoplay></video><div class="aim"></div></div>
    <p id="sst" class="muted" style="margin:10px 0 0;font-size:.88rem;text-align:center">Démarrage de la caméra…</p>
    <div class="scanlast" id="slast"><span class="muted">Visez le code-barres dans le cadre : chaque produit lu s'ajoute au panier.</span></div>
    <div class="scanbar" style="margin:12px 0 0"><input type="text" id="scan2" inputmode="numeric" autocomplete="off" placeholder="Code illisible ? Tapez-le ici" aria-label="Saisir un code-barres"><button class="btn" id="scan2ok">Ajouter</button></div>`,
    `<button class="btn primary" data-close>Terminé</button>`);
  const vid=$("#sv"), st=$("#sst"), box=$("#svbox");
  const recap=p=>{ const el=$("#slast"); if(!el) return; const nb=cart.reduce((a,l)=>a+l.q,0), tot=cart.reduce((a,l)=>a+l.q*l.sol,0);
    el.innerHTML=`<span>${p?`<b>${esc(p.nom)}</b> ajouté`:`<span style="color:var(--bad);font-weight:700">Non ajouté</span>`}</span><span class="num">${nb} article${nb>1?"s":""} · ${eur(tot)}</span>`; };
  let lastCode="", lastAt=0;
  const hit=code=>{ const now=Date.now(); if(code===lastCode&&now-lastAt<2000) return; lastCode=code; lastAt=now;
    const p=scanAdd(code); recap(p); if(box){ box.classList.add("flash"); setTimeout(()=>box&&box.classList.remove("flash"),300); } };
  const manual=()=>{ const i=$("#scan2"); const v=i.value; i.value=""; if(v.trim()) recap(scanAdd(v)); i.focus(); };
  $("#scan2ok").onclick=manual; $("#scan2").onkeydown=e=>{ if(e.key==="Enter"){ e.preventDefault(); manual(); } };
  await runScan(vid,st,box,hit);
}
async function runScan(vid,st,box,hit){
  const fail=err=>{ stopScan(); if(!st) return; const n=err&&err.name;
    st.innerHTML=n==="NotAllowedError"||n==="SecurityError"?"L'accès à la caméra est refusé. Autorisez la caméra pour cette page dans le navigateur, ou tapez le code à la main."
      :n==="NotFoundError"?"Aucune caméra trouvée sur cet appareil. Utilisez une douchette ou tapez le code à la main."
      :"La caméra n'est pas accessible ici. Utilisez une douchette ou tapez le code à la main."; if(box) box.hidden=true; };
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){ fail(); return; }
  const cons={video:{facingMode:{ideal:"environment"},width:{ideal:1280},height:{ideal:720}},audio:false};
  scanOn=true;
  let bd=null;
  if("BarcodeDetector" in window){ try{ const fm=await BarcodeDetector.getSupportedFormats(); const want=["ean_13","ean_8","upc_a","upc_e","code_128"].filter(x=>fm.includes(x)); if(want.length) bd=new BarcodeDetector({formats:want}); }catch(e){ bd=null; } }
  try{
    if(bd){
      scanStream=await navigator.mediaDevices.getUserMedia(cons);
      if(!scanOn||!document.body.contains(vid)){ stopScan(); return; }
      vid.srcObject=scanStream; await vid.play();
      st.textContent="Caméra prête.";
      const loop=async()=>{ if(!scanOn) return; try{ if(vid.readyState>=2){ const r=await bd.detect(vid); if(r&&r[0]&&r[0].rawValue) hit(r[0].rawValue); } }catch(e){} scanTimer=setTimeout(loop,180); };
      loop();
    } else {
      await loadZX(); if(!scanOn||!document.body.contains(vid)){ stopScan(); return; }
      const Z=window.ZXing, hints=new Map();
      hints.set(Z.DecodeHintType.POSSIBLE_FORMATS,[Z.BarcodeFormat.EAN_13,Z.BarcodeFormat.EAN_8,Z.BarcodeFormat.UPC_A,Z.BarcodeFormat.UPC_E,Z.BarcodeFormat.CODE_128]);
      zxReader=new Z.BrowserMultiFormatReader(hints,200);
      st.textContent="Caméra prête.";
      await zxReader.decodeFromConstraints(cons,vid,(res)=>{ if(res&&scanOn) hit(res.getText()); });
    }
  }catch(err){ fail(err); }
}

/* Recherche d'une fiche produit en ligne à partir du code-barres (Open Food Facts et bases sœurs) */
async function lookupEan(ean){
  const bases=[["https://world.openfoodfacts.org","food"],["https://world.openbeautyfacts.org","beauty"],["https://world.openproductsfacts.org","products"]];
  const one=async([u,k])=>{ const c=new AbortController(); const t=setTimeout(()=>c.abort(),6000);
    try{ const r=await fetch(`${u}/api/v2/product/${ean}.json?fields=product_name_fr,product_name,generic_name_fr,brands,categories_tags,quantity`,{signal:c.signal}); if(!r.ok) return null; const j=await r.json(); return j&&j.status===1&&j.product?{p:j.product,k}:null; }
    catch(e){ return null; } finally{ clearTimeout(t); } };
  const res=(await Promise.all(bases.map(one))).filter(Boolean); if(!res.length) return null;
  const {p,k}=res.find(r=>r.p.product_name_fr||r.p.product_name)||res[0];
  let nom=String(p.product_name_fr||p.product_name||p.generic_name_fr||"").trim(); const qte=String(p.quantity||"").trim();
  if(nom&&qte&&!nom.toLowerCase().includes(qte.toLowerCase())) nom+=" "+qte;
  const tags=(p.categories_tags||[]).join(" ");
  const cat=k==="beauty"||/diaper|couche|hygien|toothpaste|shampoo|soap|shower|deodorant/i.test(tags)?"Hygiène":/clean|detergent|lessive|dishwash|household|entretien/i.test(tags)?"Entretien":/school|stationery|scolaire/i.test(tags)?"Fourniture scolaire":/cloth|vetement|textile/i.test(tags)?"Vêtement":/toy|jouet/i.test(tags)?"Jouet":"Autres";
  return {nom,marque:String(p.brands||"").split(",")[0].trim(),cat};
}

        <div class="scanbar"><input type="text" id="rsc" inputmode="numeric" autocomplete="off" placeholder="Scannez ou tapez le code-barres, puis Entrée" aria-label="Code-barres à scanner"><button type="button" class="btn primary" id="rcam">Caméra</button></div>
        <div class="scanvid" id="rsvbox" hidden><video id="rsv" playsinline muted autoplay></video><div class="aim"></div></div>
        <p id="rsst" class="muted" style="margin:0;font-size:.85rem" aria-live="polite"></p></div>
      <label class="full">Produit<select id="rp">${S.produits.map(p=>`<option value="${p.id}">${esc(p.nom)}</option>`).join("")}<option value="__new">+ Nouveau produit…</option></select></label>
      <div class="full" style="border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:10px">
        <div class="eyebrow" id="rph">Fiche du produit</div>
        <div class="form">
        <label>Réf. produit<input type="text" id="rnr"></label><label>Code-barres<input type="text" id="rne" inputmode="numeric" placeholder="EAN 13 chiffres"></label>
        <label>Nom du produit<input type="text" id="rnn"></label><label>Catégorie<select id="rnc">${CATS.map(c=>`<option>${c}</option>`).join("")}</select></label>
        <label>Marque<input type="text" id="rnm"></label><label>Prix d'achat (€)<input type="number" step="0.01" min="0" id="rna"></label>
        <label>Prix officiel (€)<input type="number" step="0.01" min="0" id="rno"></label><label>Prix de vente solidaire (€)<input type="number" step="0.01" min="0" id="rns"></label></div>
        <p class="muted" id="rpn" style="font-size:.8rem;margin:0"></p></div>
      <input type="hidden" id="rl"><div style="display:flex;flex-direction:column;gap:4px"><span style="font-size:.82rem;font-weight:700;color:var(--muted)">Date limite</span><div class="seg" role="group" aria-label="Date limite" style="width:100%"><button type="button" style="flex:1" data-dl="none" aria-pressed="false">Pas de date limite</button><button type="button" style="flex:1" data-dl="date" aria-pressed="true">Choisir une date</button></div><input type="date" id="rd" aria-label="Date limite" min="${iso(TODAY)}"></div>
      <label>Quantité reçue<input type="number" min="0" id="rq" inputmode="numeric" placeholder="À saisir"></label><label hidden><select id="re">${["Réserve","Frigo 1","Frigo 2","Rayon B","Rayon C","Étal"].map(e=>`<option>${e}</option>`).join("")}</select></label></div>`,
      `<button class="btn" data-close>Annuler</button><button class="btn primary" id="okr">Enregistrer la réception</button>`);
    const fill=()=>{ const id=$("#rp").value, p=S.produits.find(x=>x.id===id);
      $("#rnn").value=p?p.nom:""; $("#rnc").value=p&&CATS.includes(p.cat)?p.cat:"Autres"; $("#rno").value=p?p.off:""; $("#rns").value=p?p.sol:""; $("#rnr").value=p?(p.ref||""):nextRef(); $("#rne").value=p?(p.ean||genEan()):genEan(); $("#rnm").value=p?(p.marque||""):""; $("#rna").value=p&&p.achat!=null?p.achat:"";
      $("#rph").textContent=p?"Fiche du produit (modifiable)":"Nouveau produit";
      $("#rpn").textContent=p?"Les changements de nom, catégorie ou prix s'appliquent à tout le stock de ce produit et en caisse.":""; };
    if(isNew){ $("#okr").textContent="Ajouter le produit"; $("#rq").closest("label").firstChild.textContent="Stock de départ "; $("#rp").value="__new"; $("#rp").closest("label").hidden=true; $("#rq").value=0; }
    let dlMode="date"; const setDl=m=>{ dlMode=m; document.querySelectorAll("[data-dl]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.dl===m)); $("#rd").hidden=m==="none"; if(m==="date") $("#rd").focus(); };
    document.querySelectorAll("[data-dl]").forEach(b=>b.onclick=()=>setDl(b.dataset.dl));
    $("#rp").onchange=fill; fill();
    const rst=t=>{ const e=$("#rsst"); if(e) e.innerHTML=t; };
    const afterScan=()=>{ const d=$("#rd"); if(dlMode==="date"&&d&&!d.value) d.focus(); else { const q=$("#rq"); q.focus(); q.select(); } };
    const fromCode=async raw=>{
      const code=String(raw||"").replace(/\s/g,""); if(!code) return;
      const n=normEan(code);
      const p=(n&&S.produits.find(x=>x.ean&&normEan(x.ean)===n))||S.produits.find(x=>x.ref&&String(x.ref).toLowerCase()===code.toLowerCase());
      if(p){ if(isNew){ beep(false); rst(`<b>${esc(p.nom)}</b> existe déjà dans le stock. Utilisez « Nouvelle réception » pour en ajouter.`); return; }
        $("#rp").value=p.id; fill(); beep(true); rst(`<b>${esc(p.nom)}</b> trouvé dans le stock : fiche remplie. Indiquez la quantité reçue.`); afterScan(); return; }
      if(!/^\d{8}$|^\d{12,14}$/.test(code)){ beep(false); rst(`Code « ${esc(code)} » inconnu et non valide comme code-barres.`); return; }
      $("#rp").value="__new"; fill(); $("#rne").value=code; beep(true);
      rst("Nouveau produit : recherche de sa fiche en ligne…");
      const info=await lookupEan(code);
      if(!$("#rne")||$("#rne").value!==code) return;
      if(info){ if(info.nom) $("#rnn").value=info.nom; if(info.marque) $("#rnm").value=info.marque; $("#rnc").value=info.cat;
        rst(`Nouveau produit trouvé en ligne : <b>${esc(info.nom||code)}</b>. Vérifiez la fiche, ajoutez les prix et la quantité.`); }
      else rst("Nouveau produit : aucune fiche trouvée en ligne. Complétez le nom et les prix.");
      if(info&&info.nom) afterScan(); else $("#rnn").focus();
    };
    const rsc=$("#rsc"); rsc.onkeydown=e=>{ if(e.key==="Enter"){ e.preventDefault(); const v=rsc.value; rsc.value=""; fromCode(v); } };
    setTimeout(()=>{ const r=$("#rsc"); if(r) r.focus(); },60);
    $("#rcam").onclick=async()=>{ const box=$("#rsvbox"), b=$("#rcam");
      if(!box.hidden){ stopScan(); box.hidden=true; b.textContent="Caméra"; rst(""); return; }
      box.hidden=false; b.textContent="Arrêter"; rst("Démarrage de la caméra…");
      await runScan($("#rsv"),$("#rsst"),box,code=>{ stopScan(); box.hidden=true; b.textContent="Caméra"; fromCode(code); }); };
    $("#okr").onclick=()=>{ const nom=$("#rnn").value.trim(); if(!nom){toast("Indiquez le nom du produit.");$("#rnn").focus();return;}
      if(!isNew&&$("#rq").value.trim()===""){toast("Indiquez la quantité reçue.");$("#rq").focus();return;}
      if(dlMode==="date"&&!$("#rd").value&&(parseInt($("#rq").value,10)||0)>0){toast("Choisissez une date limite ou « Pas de date limite ».");$("#rd").focus();return;}
      const ean=$("#rne").value.replace(/\s/g,"")||genEan(); if(ean&&!/^\d{8}$|^\d{12,14}$/.test(ean)){toast("Le code-barres doit contenir 8 ou 13 chiffres.");$("#rne").focus();return;}
      const info={nom,cat:$("#rnc").value.trim()||"Divers",off:Math.max(0,+$("#rno").value||0),sol:Math.max(0,+$("#rns").value||0),ref:$("#rnr").value.trim()||nextRef(),ean,marque:$("#rnm").value.trim(),achat:$("#rna").value===""?"":Math.max(0,+$("#rna").value)};
      let p; if($("#rp").value==="__new"){ p={id:uid(),...info,lots:[]}; S.produits.push(p); }
      else { p=S.produits.find(x=>x.id===$("#rp").value); Object.assign(p,info); cart.forEach(l=>{ if(l.pid===p.id) Object.assign(l,{nom:p.nom,cat:p.cat,off:p.off,sol:p.sol}); }); }
      const q=Math.max(0,parseInt($("#rq").value,10)||0);
      if(q>0) p.lots.push({lot:"R"+Date.now().toString().slice(-6),dlc:dlMode==="none"?"":$("#rd").value,q,emp:$("#re").value});
      save();closeModal();R.stock();toast(isNew?`${p.nom} ajouté au catalogue`:q>0?"Réception enregistrée":"Produit mis à jour"); };
  };
  $("#recep").onclick=()=>openRecep(false);
  const label=p=>`<div class="label"><div class="ln">${esc(p.nom)}</div><div class="lm">${esc(p.marque||"")} · ${esc(p.ref||"")}</div>${barcodeSVG(p.ean,{w:"100%"})}<div class="lp">${eur(p.sol)}<span> au lieu de ${eur(p.off)}</span></div></div>`;
  V().querySelectorAll("[data-lbl]").forEach(b=>b.onclick=()=>{ const p=S.produits.find(x=>x.id===b.dataset.lbl);
    modal(`Étiquette : ${p.nom}`,`<div style="max-width:320px;margin:0 auto">${label(p)}</div><p class="muted" style="font-size:.82rem;margin:12px 0 0;text-align:center">Code ${esc(p.ean)} · lisible par une douchette standard.</p><label style="max-width:200px;margin:14px auto 0">Nombre d'étiquettes<input type="number" id="nbl" min="1" max="240" value="24"></label>`,`<button class="btn" data-close>Fermer</button><button class="btn primary" id="print1">Imprimer</button>`);
    const b1=$("#print1"); if(b1) b1.onclick=()=>{ const n=Math.min(240,Math.max(1,parseInt($("#nbl").value,10)||1)); printLabels(Array(n).fill(p),`etiquettes-${(p.ref||p.nom).replace(/[^\w-]+/g,"-")}.pdf`,b1); }; });
  const pa=$("#printAll"); if(pa) pa.onclick=()=>{ const ps=S.produits.filter(p=>eanBits(p.ean||""));
    if(!ps.length){ toast("Aucun produit avec un code-barres valide."); return; }
    modal("Imprimer un code-barres",`<div class="form"><label class="full">Produit<select id="pp1">${ps.map(p=>`<option value="${p.id}">${esc(p.nom)}${p.ref?" · "+esc(p.ref):""}</option>`).join("")}</select></label>
      <label>Nombre d'étiquettes<input type="number" id="pn1" min="1" max="240" value="1"></label></div><div id="pv1" style="max-width:300px;margin:14px auto 0"></div>`,
      `<button class="btn" data-close>Annuler</button><button class="btn primary" id="pgo">Imprimer</button>`);
    const show=()=>{ const p=ps.find(x=>x.id===$("#pp1").value); $("#pv1").innerHTML=label(p); };
    $("#pp1").onchange=show; show();
    $("#pgo").onclick=()=>{ const p=ps.find(x=>x.id===$("#pp1").value), n=Math.min(240,Math.max(1,parseInt($("#pn1").value,10)||1));
      printLabels(Array(n).fill(p),`code-barres-${(p.ref||p.nom).replace(/[^\w-]+/g,"-")}.pdf`,$("#pgo")); };
  };
  $("#labels").onclick=()=>{ const ps=S.produits.filter(p=>eanBits(p.ean||""));
    const m=modal("Étiquettes code-barres",`<p class="muted" style="margin:0 0 12px;font-size:.88rem">${ps.length} produit(s). Le PDF se met au format A4, 24 étiquettes par page (70 × 37 mm).</p><div class="labels">${ps.map(label).join("")}</div>`,`<button class="btn" data-close>Fermer</button><button class="btn primary" id="printPl">Imprimer la planche</button>`);
    const pp=$("#printPl"); if(pp) pp.onclick=()=>printLabels(ps,"etiquettes-codes-barres.pdf",pp);
    m.style.maxWidth="900px"; };
};

/* Dons */
R.dons=function(){

  const fin=S.dons.filter(d=>d.type==="financier"&&d.date.startsWith(yr)), nat=S.dons.filter(d=>d.type==="nature"&&d.date.startsWith(yr));
  V().innerHTML=`

  <div class="grid g4" style="margin-bottom:16px">
    <div class="panel kpi"><div class="eyebrow">Dons financiers ${yr}</div><div class="v num">${eur(fin.reduce((a,d)=>a+d.montant,0))}</div><div class="s">${fin.length} don(s)</div></div>
    <div class="panel kpi"><div class="eyebrow">Dons en nature ${yr}</div><div class="v num">${eur(nat.reduce((a,d)=>a+d.montant,0))}</div><div class="s">valeur estimée</div></div>
    <div class="panel kpi"><div class="eyebrow">Donateurs</div><div class="v num">${new Set(S.dons.map(d=>d.donateur)).size}</div></div>
    <div class="panel kpi"><div class="eyebrow">Reçus à émettre</div><div class="v num">${S.dons.filter(d=>d.statut==="À émettre").length}</div></div>
  </div>
  <div class="panel"><div class="tbl-wrap"><table><thead><tr><th>Date</th><th>Donateur</th><th>Type</th><th>Canal</th><th>Référence</th><th class="r">Montant</th><th>Statut</th><th></th></tr></thead>
  <tbody>${[...S.dons].sort((a,b)=>b.date.localeCompare(a.date)).map(d=>`<tr><td class="num">${fmtD(d.date)}</td><td><b>${esc(d.donateur)}</b></td>
    <td><span class="pill ${d.type==="financier"?"acc":"neutral"}">${d.type==="financier"?"Financier":"En nature"}</span></td><td>${esc(d.canal)}</td><td class="muted">${esc(d.ref)}</td>
    <td class="r num">${eur(d.montant)}</td><td><span class="pill ${d.statut==="À émettre"?"warn":d.statut==="Sans reçu"?"neutral":"ok"}">${d.statut}</span></td>
    <td class="r" style="white-space:nowrap">${d.type==="financier"&&d.donateur!=="Anonyme"?`<button class="btn small" data-rec="${d.id}">Reçu fiscal</button>`:""} <button class="btn small danger" data-deldon="${d.id}" aria-label="Supprimer le don de ${esc(d.donateur)}">Supprimer</button></td></tr>`).join("")}</tbody></table></div></div>`;
  V().querySelectorAll("[data-rec]").forEach(b=>b.onclick=()=>recuModal(b.dataset.rec));
  V().querySelectorAll("[data-deldon]").forEach(b=>b.onclick=()=>{
    const d=S.dons.find(x=>x.id===b.dataset.deldon);
    if(!b.classList.contains("armed")){ b.classList.add("armed"); b.textContent="Confirmer";
      if(d.statut==="Reçu émis") toast("Attention : un reçu fiscal a déjà été émis pour ce don."); return; }
    S.dons=S.dons.filter(x=>x!==d); save(); R.dons(); toast(`Don de ${d.donateur} supprimé`);
  });
  $("#addDon").onclick=()=>{
    modal("Enregistrer un don",`<div class="form">
      <label class="full">Donateur<input type="text" id="dno" list="donl"><datalist id="donl">${[...new Set(S.dons.map(d=>d.donateur))].map(n=>`<option value="${esc(n)}">`).join("")}</datalist></label>
      <label>Type<select id="dty"><option value="financier">Financier</option><option value="nature">En nature</option></select></label>
      <label>Canal<select id="dca">${["HelloAsso","Chèque","Espèces","Virement","Dépôt","Ramasse"].map(c=>`<option>${c}</option>`).join("")}</select></label>
      <label>Montant ou valeur estimée (€)<input type="number" min="0" step="0.01" id="dmt"></label>
      <label>Référence<input type="text" id="dre" placeholder="N° de chèque, transaction…"></label>
      <label class="full">Adresse du donateur (pour le reçu)<input type="text" id="dad"></label></div>`,
      `<button class="btn" data-close>Annuler</button><button class="btn primary" id="okDon">Enregistrer</button>`);

function recuModal(id){

  modal("Reçu au titre des dons",`<div class="receipt">

    <dl class="dl"><dt>Donateur</dt><dd>${esc(d.donateur)}</dd><dt>Adresse</dt><dd>${esc(d.adresse||"À compléter")}</dd><dt>Date du don</dt><dd>${fmtD(d.date)}</dd>
    <dt>Montant</dt><dd class="num">${eur(d.montant)}</dd><dt>Forme</dt><dd>${esc(d.canal)}${d.ref?" · "+esc(d.ref):""}</dd><dt>Nature</dt><dd>Numéraire</dd></dl>
    <p class="muted" style="font-size:.82rem;margin:4px 0 0">Le bénéficiaire certifie que ce don ouvre droit à la réduction d'impôt prévue aux articles 200 et 238 bis du CGI. Pour les particuliers, les dons aux organismes d'aide aux personnes en difficulté ouvrent droit à 75 % dans la limite du plafond en vigueur, puis 66 %.</p>
  </div>`,`<button class="btn" data-close>Fermer</button>${d.statut==="À émettre"?`<button class="btn primary" id="emit">Marquer comme émis</button>`:""}`);
  const e=$("#emit"); if(e) e.onclick=()=>{d.statut="Reçu émis";save();closeModal();R.dons();toast("Reçu marqué comme émis");};
}

R.equipe=function(){

function applyRow(row){
  const k=row.cle; if(!k) return false;
  const local=hashKey(k);
  if(SYNC.sent[k]!==undefined&&local!==SYNC.sent[k]) return false; // modification locale pas encore envoyée : elle gagne
  const h=hashOf(JSON.stringify(row.valeur===undefined?null:row.valeur));
  if(h===local){ SYNC.sent[k]=h; return false; }
  S[k]=row.valeur; SYNC.sent[k]=h; return true;
}
function syncQueue(){ if(!SYNC.on||!SYNC.user) return; clearTimeout(SYNC.timer); SYNC.timer=setTimeout(syncPush,500); }
async function syncPush(){
  if(!SYNC.on||!SYNC.user) return;
  if(SYNC.busy){ SYNC.again=true; return; }
  const keys=Object.keys(S).filter(k=>hashKey(k)!==SYNC.sent[k]); if(!keys.length){ if(SYNC.state!=="ok") setSyncState("ok"); return; }
  SYNC.busy=true; setSyncState("wait");
  const now=new Date().toISOString(); const hs={}; const rows=keys.map(k=>{ hs[k]=hashKey(k); return {cle:k,valeur:S[k]===undefined?null:S[k],maj:now}; });
  try{ const {error}=await SYNC.db.from(SB_TABLE).upsert(rows); if(error) throw error; keys.forEach(k=>SYNC.sent[k]=hs[k]); saveSent(); setSyncState("ok"); }
  catch(e){ setSyncState("err"); clearTimeout(SYNC.timer); SYNC.timer=setTimeout(syncPush,15000); }
  finally{ SYNC.busy=false; if(SYNC.again){ SYNC.again=false; syncQueue(); } }
}
async function syncPull(first){
  setSyncState("wait");
  const {data,error}=await SYNC.db.from(SB_TABLE).select("cle,valeur"); if(error) throw error;
  const fresh=!Object.keys(SYNC.sent).length; let changed=false;
  if(data.length&&fresh){ // premier passage sur cet appareil : on reprend les données partagées
    data.forEach(r=>{ S[r.cle]=r.valeur; SYNC.sent[r.cle]=hashOf(JSON.stringify(r.valeur===undefined?null:r.valeur)); }); changed=true;
    if(first) toast("Données partagées récupérées");
  } else data.forEach(r=>{ if(applyRow(r)) changed=true; });
  if(changed){ try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){} syncRefresh(); }
  saveSent(); await syncPush(); if(SYNC.state==="wait") setSyncState("ok");
}
let syncChan=null;
async function syncStart(){
  try{ await syncPull(true); }catch(e){ setSyncState("err"); }
  if(syncChan) SYNC.db.removeChannel(syncChan);

    if(p.new&&applyRow(p.new)){ try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){} saveSent(); syncRefresh(); }
  }).subscribe();
}

  closeModal(); WHO=null; try{ localStorage.removeItem(WHO_KEY); }catch(e){}
  const d=document.createElement("div"); d.id="lock"; d.setAttribute("role","dialog"); d.setAttribute("aria-modal","true"); d.setAttribute("aria-label","Saisir votre code PIN");
  d.innerHTML=`<div class="lock-card"><div class="lock-logo">${S.logo?`<img src="${S.logo}" alt="">`:$("#logoDefault").outerHTML.replace('id="logoDefault"',"")}</div><h1>Panier Commun</h1><p class="muted">Entrez votre code à 4 chiffres</p>
    <div class="pin-dots" aria-live="polite"><i></i><i></i><i></i><i></i></div><p class="pin-err" id="pinErr"></p>
    <div class="pin-pad">${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-k="${n}">${n}</button>`).join("")}<span></span><button data-k="0">0</button><button data-k="del" aria-label="Effacer">⌫</button></div></div>`;
  document.body.appendChild(d); document.body.style.overflow="hidden";
  let code="";
  const dots=()=>d.querySelectorAll(".pin-dots i").forEach((x,i)=>x.classList.toggle("on",i<code.length));
  const err=t=>{ d.querySelector("#pinErr").textContent=t; };
  const tryCode=()=>{
    if(Date.now()<lockUntil){ err(`Trop d'essais. Réessayez dans ${Math.ceil((lockUntil-Date.now())/1000)} s.`); code=""; dots(); return; }
    const m=S.equipe.find(e=>e.pin&&e.pin===pinHash(e.id,code));
    if(m){ WHO=m.id; touchWho(); lockTries=0; saveTries(); d.remove(); document.body.style.overflow=""; renderWho(); route(); toast(`Bonjour ${m.nom.split(" ")[0]}`); return; }
    lockTries++; if(lockTries>=5){ lockTries=0; lockUntil=Date.now()+30000; err("Trop d'essais. Réessayez dans 30 s."); } else err("Code incorrect."); saveTries();
    const p=d.querySelector(".pin-dots"); p.classList.remove("shake"); void p.offsetWidth; p.classList.add("shake"); code=""; dots();
  };
  const key=k=>{ if(k==="del") code=code.slice(0,-1); else if(code.length<4){ code+=k; err(""); } dots(); if(code.length===4) setTimeout(tryCode,120); };
  d.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>key(b.dataset.k));
  d.addEventListener("keydown",e=>{ if(/^\d$/.test(e.key)) key(e.key); else if(e.key==="Backspace") key("del"); e.stopPropagation(); });
  d.tabIndex=-1; d.focus();
}
function needLock(){ return lockOn()&&!me(); }
function checkLock(){ renderWho(); if(needLock()) lockScreen(); }
["pointerdown","keydown"].forEach(ev=>document.addEventListener(ev,()=>{ if(!$("#lock")) touchWho(); },{passive:true}));
setInterval(()=>{ if(!lockOn()||!WHO) return; try{ const w=JSON.parse(localStorage.getItem(WHO_KEY)); if(!w||Date.now()-w.t>LOCK_MIN*60000) lockScreen(); }catch(e){} },30000);
$("#lockBtn").onclick=()=>{ lockScreen(); toast("Session verrouillée"); };
// Panneau de réglage des accès (Coordinatrice)
function accesPanel(){
  if(!canAdmin()) return "";
  const rs=roles().filter(r=>!/^coordinat/i.test(r));
  return `<div class="panel" style="margin-top:16px"><h2 style="margin-bottom:4px">Accès par rôle</h2><p class="muted" style="font-size:.85rem;margin:0 0 10px">Cochez les écrans que chaque rôle peut ouvrir. La Coordinatrice a toujours accès à tout. Les codes PIN se règlent en touchant un membre.</p>
  <div class="tbl-wrap"><table class="acc-tbl"><thead><tr><th>Rôle</th>${VIEWS.map(v=>`<th class="c">${esc(v[1])}</th>`).join("")}</tr></thead><tbody>
  ${rs.map(r=>`<tr><td><b>${esc(ROLE_LBL[r]||r)}</b></td>${VIEWS.map(([k,l])=>`<td class="c"><input type="checkbox" data-acc="${esc(r)}|${k}" ${accesRole(r).includes(k)?"checked":""} aria-label="${esc(r)} : ${esc(l)}"></td>`).join("")}</tr>`).join("")}
  </tbody></table></div></div>`;
}
function bindAcces(){
  V().querySelectorAll("[data-acc]").forEach(c=>c.onchange=()=>{
    const [r,k]=c.dataset.acc.split("|"); S.acces=S.acces||{}; const cur=new Set(accesRole(r));
    if(c.checked) cur.add(k); else cur.delete(k); S.acces[r]=VIEWS.map(v=>v[0]).filter(x=>cur.has(x)); save(); toast(`Accès de « ${ROLE_LBL[r]||r} » mis à jour`);
  });
}

/* ---------- Mode sombre ---------- */
const THEME_KEY=KEY+"-theme", THEMES=[["auto","Automatique","◐"],["light","Clair","☀"],["dark","Sombre","☾"]];
const mqDark=window.matchMedia?window.matchMedia("(prefers-color-scheme: dark)"):null;
let THEME="auto"; try{ const t=localStorage.getItem(THEME_KEY); if(t==="light"||t==="dark") THEME=t; }catch(e){}
function applyTheme(){
  const r=document.documentElement; if(THEME==="auto") r.removeAttribute("data-theme"); else r.setAttribute("data-theme",THEME);
  const dark=THEME==="dark"||(THEME==="auto"&&mqDark&&mqDark.matches);
  const b=$("#themeBtn"); if(b){ const t=THEMES.find(x=>x[0]===THEME); b.innerHTML=`<span aria-hidden="true">${t[2]}</span><span class="tl"> ${t[1]}</span>`; b.setAttribute("aria-label","Apparence : "+t[1]+". Toucher pour changer."); }
  try{ if(window.Android&&window.Android.setBars) window.Android.setBars(getComputedStyle(document.body).backgroundColor.match(/\d+/g).slice(0,3).map(n=>(+n).toString(16).padStart(2,"0")).join(""),getComputedStyle(r).getPropertyValue("--surface").trim().replace("#",""),dark); }catch(e){}
}
$("#themeBtn").onclick=()=>{ const i=THEMES.findIndex(x=>x[0]===THEME); THEME=THEMES[(i+1)%3][0]; try{ localStorage.setItem(THEME_KEY,THEME); }catch(e){} applyTheme(); toast("Apparence : "+THEMES.find(x=>x[0]===THEME)[1]+(THEME==="auto"?" (suit le réglage de l'appareil)":"")); };
if(mqDark){ const f=()=>{ if(THEME==="auto") applyTheme(); }; mqDark.addEventListener?mqDark.addEventListener("change",f):mqDark.addListener(f); }
applyTheme();
const logoEdit=k=>()=>{ if(!canAdmin()){ return; } logoModal(k); };
$("#logoSlot").onclick=logoEdit("logo"); $("#logo2Slot").onclick=logoEdit("logo2"); $("#logo3Slot").onclick=logoEdit("logo3"); renderLogo();
syncInit();
route();
checkLock();
})();
</script>
